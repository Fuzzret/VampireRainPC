# XenonRecomp config for Vampire Rain
# Paths are relative to this file (place it in work\ - the setup script does this).

[main]
file_path = "default_dec.xex"
out_directory_path = "../recomp_out"
switch_table_file_path = "switch_tables.toml"
# patch_file_path = "default.xexp"   # only if you apply a title update patch

# Optimizations - leave off until the first build compiles and runs.
skip_lr = false
skip_msr = false
ctr_as_local = false
xer_as_local = false
reserved_as_local = false
cr_as_local = false
non_argument_as_local = false
non_volatile_as_local = false

# Compiler-generated register save/restore helpers and setjmp/longjmp.
# Find these in IDA/Ghidra: __savegprlr_14 / __restgprlr_14 are runs of
# "std r14..r31" / "ld r14..r31" ending in a branch; the FPR and VMX versions
# look the same with stfd/lfd and stvx/lvx. Filled in from a signature scan of
# default_dec.xex (each pattern matched exactly once; bodies verified).
restgprlr_14_address = 0x8229ED30
savegprlr_14_address = 0x8229ECE0
restfpr_14_address   = 0x822A0A2C
savefpr_14_address   = 0x822A09E0
restvmx_14_address   = 0x822A1FD8
savevmx_14_address   = 0x822A1D40
restvmx_64_address   = 0x822A206C
savevmx_64_address   = 0x822A1DD4
longjmp_address      = 0x8250CF00
setjmp_address       = 0x8250D020

# Leaf functions with no .pdata entry that contain jump tables. XenonRecomp's
# own analysis ends them at the jump-table branch ("Switch case ... is trying
# to jump outside function"), so their real bounds are declared here. Functions
# reached only through pointers inside those gaps are listed separately.
